<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-F.brand Product</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

nav{
  border-bottom:1px solid #eee;
  padding:22px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:Georgia,serif;
  font-size:28px;
  letter-spacing:2px;
}

.logo span{
  color:#c9a35b;
}

.links a{
  margin-left:22px;
  text-decoration:none;
  color:#111;
  font-size:14px;
}

.product{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  padding:60px 0;
}

.main-image{
  width:100%;
  max-height:650px;
  object-fit:cover;
}

.gallery{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.gallery img{
  width:80px;
  height:100px;
  object-fit:cover;
  cursor:pointer;
  border:1px solid #ddd;
}

.info h1{
  font-family:Georgia,serif;
  font-size:38px;
  margin-top:0;
}

.price{
  font-size:22px;
  margin:20px 0;
}

.description{
  line-height:1.8;
  color:#555;
  white-space:pre-line;
}

.sizes{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:25px 0;
}

.size{
  border:1px solid #ccc;
  padding:10px 18px;
}

.btn{
  display:inline-block;
  padding:14px 30px;
  background:#c9a35b;
  color:white;
  text-decoration:none;
  border:0;
  cursor:pointer;
}

.other{
  padding:50px 0;
  border-top:1px solid #eee;
}

.other h2{
  font-family:Georgia,serif;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  border:1px solid #eee;
  padding:15px;
}

.card img{
  width:100%;
  height:320px;
  object-fit:cover;
}

.card h3{
  font-family:Georgia,serif;
}

.card a{
  text-decoration:none;
  color:#111;
}

@media(max-width:700px){
  .product{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .links a{
    margin-left:8px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="container nav">

    <div class="logo">
      A<span>-F</span>.BRAND
    </div>

    <div class="links">
      <a href="index.html">Collection</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
      <a href="login.html">Owner Login</a>
    </div>

  </div>
</nav>


<div class="container">

  <div id="product" class="product">
    Loading product...
  </div>

  <section class="other">

    <h2>Other Products</h2>

    <div id="products" class="products"></div>

  </section>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBm0vK3se38fPbP12zLkyMztcTP-2zpiU",

  authDomain: "af-brand-jabai.firebaseapp.com",

  projectId: "af-brand-jabai",

  storageBucket: "af-brand-jabai.firebasestorage.app",

  messagingSenderId: "794703482293",

  appId: "1:794703482293:web:b4de7e5a3af0723621dfc"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const params = new URLSearchParams(window.location.search);

const productId = params.get("id");

const productBox = document.getElementById("product");


async function loadProduct(){

  if(!productId){

    productBox.innerHTML = "Product not found ❌";

    return;
  }


  try{

    const productRef = doc(db,"products",productId);

    const productSnap = await getDoc(productRef);


    if(!productSnap.exists()){

      productBox.innerHTML = "Product not found ❌";

      return;
    }


    const p = productSnap.data();


    let allImages = [];

    if(p.image){
      allImages.push(p.image);
    }

    if(Array.isArray(p.images)){
      allImages = allImages.concat(p.images);
    }


    let gallery = "";

    allImages.forEach((img,index)=>{

      gallery += `
        <img
          src="${img}"
          onclick="changeImage('${img}')"
        >
      `;

    });


    let sizes = "";

    if(Array.isArray(p.sizes)){

      p.sizes.forEach(size=>{

        sizes += `
          <div class="size">${size}</div>
        `;

      });

    }


    productBox.innerHTML = `

      <div>

        <img
          id="mainImage"
          class="main-image"
          src="${allImages[0] || ''}"
        >

        <div class="gallery">
          ${gallery}
        </div>

      </div>


      <div class="info">

        <h1>${p.name || ""}</h1>

        <div class="price">
          Rs. ${p.price || ""}
        </div>

        <div class="description">
          ${p.longDescription || p.description || ""}
        </div>

        <h3>Available Sizes</h3>

        <div class="sizes">
          ${sizes || "Size information not available"}
        </div>

        <a
          class="btn"
          href="https://wa.me/923417884713"
        >
          Buy Now
        </a>

      </div>

    `;

  }catch(error){

    console.error(error);

    productBox.innerHTML =
      "Error loading product: " + error.message;

  }

}


window.changeImage = function(img){

  document.getElementById("mainImage").src = img;

};


async function loadOtherProducts(){

  const box = document.getElementById("products");

  const snapshot = await getDocs(collection(db,"products"));


  snapshot.forEach(docSnap=>{

    const p = docSnap.data();

    box.innerHTML += `

      <div class="card">

        <a href="product.html?id=${docSnap.id}">

          <img src="${p.image || ""}">

          <h3>${p.name || ""}</h3>

        </a>

        <div>
          Rs. ${p.price || ""}
        </div>

      </div>

    `;

  });

}


loadProduct();

loadOtherProducts();

</script>

</body>
</html>
