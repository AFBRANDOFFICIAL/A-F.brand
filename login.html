<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-F.brand Owner Login</title>

<style>

body{
font-family:Arial,sans-serif;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:350px;
border:1px solid #ddd;
padding:30px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
}

button{
padding:12px 25px;
background:#c9a35b;
border:none;
cursor:pointer;
}

</style>

</head>


<body>


<div class="login-box">

<h2>
A-F.brand Owner Login
</h2>


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button id="login">
Login
</button>


<p id="message"></p>


</div>




<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyBm0vK3se38fPbPl2zLZkyMztcTP-2zpiU",

authDomain: "af-brand-jabai.firebaseapp.com",

projectId: "af-brand-jabai",

storageBucket: "af-brand-jabai.firebasestorage.app",

messagingSenderId: "794703482293",

appId: "1:794703482293:web:b4bde7e5a3af0723621dfc",

measurementId: "G-SCPD0MJV2F"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



document.getElementById("login").onclick = function(){

let email = document.getElementById("email").value;

let password = document.getElementById("password").value;


signInWithEmailAndPassword(auth,email,password)

.then(()=>{

document.getElementById("message").innerHTML="Login Successful ✅";

window.location.href="admin.html";

})


.catch(()=>{

document.getElementById("message").innerHTML="Wrong Email or Password ❌";

});


}


</script>


</body>

</html>
