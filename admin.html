<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-F.brand Admin</title>

<style>

body{
font-family:Arial;
padding:30px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
}

button{
padding:12px 25px;
background:#c9a35b;
border:0;
cursor:pointer;
}

</style>

</head>

<body>


<h1>
A-F.brand Admin Panel
</h1>


<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price">

<textarea id="description" placeholder="Short Description"></textarea>

<textarea id="longDescription" placeholder="Long Product Description"></textarea>

<input id="image" placeholder="Main Image Link">

<textarea id="images" placeholder="Other Image Links (one per line)"></textarea>

<input id="sizes" placeholder="Sizes e.g. S, M, L, XL">


<button id="add">
Add Product
</button>


<p id="msg"></p>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBm0vK3se38fPbP12zLkyMztcTP-2zpiU",
  authDomain: "af-brand-jabai.firebaseapp.com",
  projectId: "af-brand-jabai",
  storageBucket: "af-brand-jabai.firebasestorage.app",
  messagingSenderId: "794703482293",
  appId: "1:794703482293:web:b4de7e5a3af0723621dfc"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


document.getElementById("add").addEventListener("click", async () => {

  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const description = document.getElementById("description").value.trim();
  const longDescription = document.getElementById("longDescription").value.trim();
  const image = document.getElementById("image").value.trim();
  const imagesText = document.getElementById("images").value.trim();
  const sizesText = document.getElementById("sizes").value.trim();

  const msg = document.getElementById("msg");


  if (!name || !price || !description || !longDescription || !image || !sizesText) {
    msg.innerHTML = "Please fill all required fields ❌";
    return;
  }


  msg.innerHTML = "Adding product...";


  const images = imagesText
    .split("\n")
    .map(url => url.trim())
    .filter(url => url !== "");


  try {

    await addDoc(collection(db, "products"), {

      name: name,
      price: price,
      description: description,
      longDescription: longDescription,
      image: image,
      images: images,
      sizes: sizesText
        .split(",")
        .map(size => size.trim())
        .filter(size => size !== "")

    });


    msg.innerHTML = "Product Added Successfully ✅";


    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("description").value = "";
    document.getElementById("longDescription").value = "";
    document.getElementById("image").value = "";
    document.getElementById("images").value = "";
    document.getElementById("sizes").value = "";


  } catch (error) {

    console.error(error);
    msg.innerHTML = "Error: " + error.message + " ❌";

  }

});

</script>

</body>

</html>
