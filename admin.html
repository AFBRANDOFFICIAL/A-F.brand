<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-F.brand Admin</title>

<style>

body{
font-family:Arial;
padding:30px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
}

button{
padding:12px 25px;
background:#c9a35b;
border:0;
cursor:pointer;
margin-top:8px;
}

#preview{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:15px 0;
}

.photo-box{
position:relative;
}

.photo-box img{
width:100px;
height:120px;
object-fit:cover;
}

.remove{
position:absolute;
top:0;
right:0;
background:#111;
color:white;
padding:3px 7px;
border:0;
margin:0;
}

</style>
</head>

<body>

<h1>A-F.brand Admin Panel</h1>

<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price">

<textarea id="description" placeholder="Short Description"></textarea>

<textarea id="longDescription" placeholder="Long Product Description"></textarea>

<h3>Product Photos</h3>

<input
  type="file"
  id="photoInput"
  accept="image/*"
  multiple
>

<div id="preview"></div>

<input id="sizes" placeholder="Sizes e.g. S, M, L, XL">

<button type="button" id="add">
Add Product
</button>

<p id="msg"></p>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBm0vK3se38fPbP12zLkyMztcTP-2zpiU",
  authDomain: "af-brand-jabai.firebaseapp.com",
  projectId: "af-brand-jabai",
  storageBucket: "af-brand-jabai.firebasestorage.app",
  messagingSenderId: "794703482293",
  appId: "1:794703482293:web:b4de7e5a3af0723621dfc"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* IMGBB API KEY */

const IMGBB_API_KEY = "PASTE_YOUR_IMGBB_KEY_HERE";


const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");


/* SELECTED PHOTOS */

let selectedPhotos = [];


/* PHOTO SELECT */

photoInput.addEventListener("change", () => {

  const files = Array.from(photoInput.files);

  if(files.length === 0){
    return;
  }

  selectedPhotos.push(...files);

  showPreview();

  photoInput.value = "";

});


/* SHOW PREVIEW */

function showPreview(){

  preview.innerHTML = "";

  selectedPhotos.forEach((file,index) => {

    const box = document.createElement("div");

    box.className = "photo-box";

    const img = document.createElement("img");

    img.src = URL.createObjectURL(file);

    const remove = document.createElement("button");

    remove.className = "remove";

    remove.innerHTML = "×";

    remove.type = "button";

    remove.onclick = () => {

      selectedPhotos.splice(index,1);

      showPreview();

    };

    box.appendChild(img);

    box.appendChild(remove);

    preview.appendChild(box);

  });

}


/* ADD PRODUCT */

document.getElementById("add").addEventListener("click", async () => {

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const longDescription =
    document.getElementById("longDescription").value.trim();

  const sizesText =
    document.getElementById("sizes").value.trim();

  const msg =
    document.getElementById("msg");


  if(
    !name ||
    !price ||
    !description ||
    !longDescription ||
    !sizesText ||
    selectedPhotos.length === 0
  ){

    msg.innerHTML =
      "Please fill all required fields ❌";

    return;

  }


  msg.innerHTML =
    "Uploading photos... ⏳";


  try{

    const imageUrls = [];


    /* UPLOAD ALL PHOTOS */

    for(
      let i = 0;
      i < selectedPhotos.length;
      i++
    ){

      msg.innerHTML =
        "Uploading photo " +
        (i + 1) +
        " of " +
        selectedPhotos.length +
        "... ⏳";


      const formData = new FormData();

      formData.append(
        "image",
        selectedPhotos[i]
      );


      const response = await fetch(
        "https://api.imgbb.com/1/upload?key=" +
        IMGBB_API_KEY,
        {
          method:"POST",
          body:formData
        }
      );


      const data = await response.json();


      if(!data.success){

        throw new Error(
          data.error?.message ||
          data.status_txt ||
          "Photo upload failed"
        );

      }


      imageUrls.push(
        data.data.url
      );

    }


    /* SAVE TO FIRESTORE */

    msg.innerHTML =
      "Saving product... ⏳";


    await addDoc(
      collection(db,"products"),
      {

        name:name,

        price:price,

        description:description,

        longDescription:longDescription,

        image:imageUrls[0],

        images:imageUrls,

        sizes:sizesText
          .split(",")
          .map(size => size.trim())
          .filter(size => size !== "")

      }
    );


    msg.innerHTML =
      "Product Added Successfully ✅";


    /* CLEAR FORM */

    document.getElementById("name").value = "";

    document.getElementById("price").value = "";

    document.getElementById("description").value = "";

    document.getElementById("longDescription").value = "";

    document.getElementById("sizes").value = "";

    selectedPhotos = [];

    showPreview();


  }catch(error){

    console.error(error);

    msg.innerHTML =
      "Error: " +
      error.message +
      " ❌";

  }

});

</script>

</body>
</html>
