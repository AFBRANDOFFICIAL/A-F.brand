<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-F.brand Admin</title>

<style>

body{
font-family:Arial;
padding:30px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
}

button{
padding:12px 25px;
background:#c9a35b;
border:0;
cursor:pointer;
}

#preview{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:15px 0;
}

#preview img{
width:100px;
height:120px;
object-fit:cover;
}

</style>
</head>

<body>

<h1>A-F.brand Admin Panel</h1>

<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price">

<textarea id="description" placeholder="Short Description"></textarea>

<textarea id="longDescription" placeholder="Long Product Description"></textarea>

<h3>Product Photos</h3>

<input
  type="file"
  id="photoFiles"
  accept="image/*"
  multiple
>

<div id="preview"></div>

<input id="sizes" placeholder="Sizes e.g. S, M, L, XL">

<button id="add">
Add Product
</button>

<p id="msg"></p>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBm0vK3se38fPbP12zLkyMztcTP-2zpiU",
  authDomain: "af-brand-jabai.firebaseapp.com",
  projectId: "af-brand-jabai",
  storageBucket: "af-brand-jabai.firebasestorage.app",
  messagingSenderId: "794703482293",
  appId: "1:794703482293:web:b4de7e5a3af0723621dfc"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* TEST API KEY */

const IMGBB_API_KEY = "PASTE_NEW_KEY_HERE";


const photoFiles = document.getElementById("photoFiles");
const preview = document.getElementById("preview");


/* PHOTO PREVIEW */

photoFiles.addEventListener("change", () => {

  preview.innerHTML = "";

  Array.from(photoFiles.files).forEach(file => {

    const img = document.createElement("img");

    img.src = URL.createObjectURL(file);

    preview.appendChild(img);

  });

});


/* ADD PRODUCT */

document.getElementById("add").addEventListener("click", async () => {

  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const description = document.getElementById("description").value.trim();
  const longDescription = document.getElementById("longDescription").value.trim();
  const sizesText = document.getElementById("sizes").value.trim();
  const files = Array.from(photoFiles.files);
  const msg = document.getElementById("msg");


  if(
    !name ||
    !price ||
    !description ||
    !longDescription ||
    !sizesText ||
    files.length === 0
  ){

    msg.innerHTML = "Please fill all required fields ❌";

    return;
  }


  msg.innerHTML = "Uploading photos...";


  try {

    const imageUrls = [];


    /* UPLOAD EACH PHOTO */

    for(const file of files){

      const formData = new FormData();

      formData.append("key", IMGBB_API_KEY);
      formData.append("image", file);


      const response = await fetch(
        "https://api.imgbb.com/1/upload",
        {
          method:"POST",
          body:formData
        }
      );


      const data = await response.json();


      if(!data.success){

        throw new Error("Photo upload failed");

      }


      imageUrls.push(data.data.url);

    }


    msg.innerHTML = "Saving product...";


    /* SAVE TO FIRESTORE */

    await addDoc(collection(db,"products"),{

      name:name,

      price:price,

      description:description,

      longDescription:longDescription,

      image:imageUrls[0],

      images:imageUrls,

      sizes:sizesText
        .split(",")
        .map(size => size.trim())
        .filter(size => size !== "")

    });


    msg.innerHTML =
      "Product Added Successfully ✅";


    /* CLEAR FORM */

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("description").value = "";
    document.getElementById("longDescription").value = "";
    document.getElementById("sizes").value = "";

    photoFiles.value = "";
    preview.innerHTML = "";


  } catch(error){

    console.error(error);

    msg.innerHTML =
      "Error: " + error.message + " ❌";

  }

});

</script>

</body>
</html>
